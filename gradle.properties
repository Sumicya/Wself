# --- JVM / Gradle ------------------------------------------------------------
org.gradle.jvmargs=-Xmx5g -XX:MaxMetaspaceSize=768m -Xss512k -Dfile.encoding=UTF-8 -XX:+UseParallelGC -XX:ReservedCodeCacheSize=512m
org.gradle.parallel=false
org.gradle.caching=true
org.gradle.configureondemand=true
org.gradle.configuration-cache=false

# --- Kotlin / Android ---------------------------------------------------------
android.useAndroidX=true
kotlin.code.style=official
kotlin.daemon.jvm.options=-Xmx3g,-XX:MaxMetaspaceSize=1g,-XX:ReservedCodeCacheSize=256m
android.r8.maxWorkers=1
android.r8.gradual.support=true

# --- Network ------------------------------------------------------------------
systemProp.org.gradle.internal.http.connectionTimeout=300000
systemProp.org.gradle.internal.http.socketTimeout=600000

# Keep SDK/NDK installed on the machine; do not auto-download during builds.
android.builder.sdkDownload=false

# --- SDK/NDK overrides (needed on constrained envs like Termux) ---------------
# The project defaults to compileSdk/targetSdk 37. If you only have an older
# platform/NDK installed, override via CLI:
#   ./gradlew -PcompileSdk=36 -PtargetSdk=36 -PndkVersion=29.0.0 assembleStandardRelease
#   ./gradlew -PcompileSdk=35 -PtargetSdk=35 assembleStandardRelease
#compileSdk=36
#targetSdk=36
#minSdk=28
#ndkVersion=29.0.0

# --- Optional Maven mirrors ----------------------------------------------------
# Local/self-hosted Maven mirror (absolute path or URL). Prefer the CLI:
#   ./gradlew -PwekitLocalMavenMirror=/path/to/mirror
# or the WEKIT_LOCAL_MAVEN_MIRROR env var. This file is only a fallback.
#wekitLocalMavenMirror=/path/to/mirror

# Set to true to prefer the Tencent Maven public mirror (China network friendly):
#   ./gradlew -PwekitUseChinaMirror=true
#wekitUseChinaMirror=false
